<p class="h4">Counter : {{ counter() }}</p>
<button (click)="changeCounter()" class="btn btn-main">Increment</button>

<hr />

<p>Total Price : {{ totalPrice() }}</p>
<button (click)="changePrice()" class="btn btn-main">Change price</button>

<hr />

<p class="h4 mt-5">Name : {{ userName() }}</p>
<button (click)="changeName()" class="btn btn-main">Change</button>
