<section class="bg-main-light rounded-4 shadow p-4 my-3">
  <div class="d-flex justify-content-between align-items-center">
    <h1 class="h1 text-center">Shop Cart</h1>
    <button (click)="clearAllItems()" class="btn btn-danger btn-md rounded-2">
      Clear Cart
    </button>
  </div>
  <h2 class="h5 text-main">
    Total Cart Price: {{ cartItems.totalCartPrice | currency: " EGP " }}
  </h2>
  @for (item of cartItems.products; track item.product.id) {
    <div class="row mb-2 border-bottom align-items-center">
      <div class="col-md-1">
        <div>
          <img
            [src]="item.product.imageCover"
            class="w-100"
            [alt]="item.product.title"
          />
        </div>
      </div>
      <div class="col-md-11">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h3 class="h5">{{ item.product.title }}</h3>
            <p class="text-main">
              Price : {{ item.price | currency: " EGP " }}
            </p>
            <div
              (click)="deleteCartItem(item.product.id)"
              class="d-flex align-items-center"
            >
              <i class="cursor-pointer fa-solid fa-trash text-danger"></i>
            </div>
          </div>

          <div
            class="d-flex justify-content-center align-items-center column-gap-1"
          >
            <span (click)="updateItemQuantity(item.product.id, item.count + 1)">
              <i
                class="text-main cursor-pointer fa-solid fa-circle-plus fa-2xl"
              ></i>
            </span>

            <span class="fs-5">{{ item.count }}</span>
            <span (click)="updateItemQuantity(item.product.id, item.count - 1)">
              <i
                class="text-main cursor-pointer fa-solid fa-circle-minus fa-2xl"
              ></i>
            </span>
          </div>
        </div>
      </div>
    </div>
  }
  <button [routerLink]="['/orders', cartItems._id]" class="btn btn-main">
    Orders
  </button>
</section>
